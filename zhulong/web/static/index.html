<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>烛龙 · 系统监控</title>
<script src="chart.umd.js"></script>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <div class="brand-wrap">
    <!-- 烛龙 logo：龙身圆环 + 龙首双角 + 腹中烛火（精修版） -->
    <svg class="logo" viewBox="0 0 64 64" aria-label="烛龙">
      <path d="M34 9 C49 10 56 21 56 33 C56 47 46 56 32 56 C18 56 8 47 8 33 C8 21 15 11 27 9"
            fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M33 12.5 C45 13.5 52 22.5 52 33 C52 44.5 44 52.5 33 53"
            fill="none" stroke="currentColor" stroke-width="1.1" opacity=".4" stroke-linecap="round"/>
      <path d="M24 10 C22 6 24 2.5 28 2.5 M28 10 C28 6 31 3.5 34 4.5"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M23 10 C23 13 26 15 30 14 C33 13 34 10 32 8"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="27" cy="9.5" r="1.3" fill="currentColor"/>
      <path d="M32 21 C35.5 25.5 37.5 28.5 37.5 33 C37.5 37.5 35.5 40.5 32 40.5 C28.5 40.5 26.5 37.5 26.5 33 C26.5 28.5 28.5 25.5 32 21 Z"
            fill="currentColor" opacity=".95"/>
      <path d="M32 27.5 C33.8 29.8 34.8 31.5 34.8 33.6 C34.8 35.9 33.8 37.4 32 37.4 C30.2 37.4 29.2 35.9 29.2 33.6 C29.2 31.5 30.2 29.8 32 27.5 Z"
            fill="var(--ink)" opacity=".45"/>
    </svg>
    <div>
      <div class="brand"><span class="word">烛 龙</span><span class="sub">系统监控</span></div>
      <div class="path" id="programPath">…</div>
    </div>
  </div>
  <div class="head-right">
    <div class="pills" id="rangePills">
      <div class="pill on" data-range="24h">24小时</div>
      <div class="pill" data-range="7d">7天</div>
      <div class="pill" data-range="30d">30天</div>
    </div>
    <button class="theme-btn" id="themeBtn">
      <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none">
        <path d="M2.5 12 C6 6.5 18 6.5 21.5 12 C18 17.5 6 17.5 2.5 12 Z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
      <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M2.5 12 C6 16 18 16 21.5 12"/><path d="M6 14.5 L4.8 16.2 M12 15.5 L12 17.8 M18 14.5 L19.2 16.2"/>
      </svg>
      <span id="themeLabel">夜</span>
    </button>
  </div>
</header>
<main>
  <section class="top">
    <div class="hero">
      <div class="num" id="heroNum">–</div>
      <div class="meta">
        <div class="cn" id="heroCn">提交内存水位</div>
        <div class="en">commit_percent</div>
        <div class="desc" id="heroDesc"></div>
      </div>
    </div>
    <div class="subcards" id="subcards"></div>
  </section>

  <div class="alert" id="alert" hidden>
    <div class="head"><span class="led"></span><span id="alertTitle"></span></div>
    <div class="advice" id="alertAdvice"></div>
  </div>
  <div class="handled" id="handledLine" hidden><span class="led"></span><span id="handledText"></span></div>

  <div class="charts">
    <div class="box main">
      <span class="corner tl"></span><span class="corner br"></span>
      <h4 id="mainTitle">提交内存水位</h4>
      <div class="chart-wrap main-wrap"><canvas id="mainChart"></canvas></div>
      <div class="legend-note" id="legendNote" hidden>
        <span><i style="background:var(--ok)"></i>处理点（已自动处置）</span>
        <span><i style="background:var(--info)"></i>提醒点（已通知）</span>
        <span><i style="background:var(--danger)"></i>待处理（降级，需人工）</span>
        <span><i style="background:var(--mut)"></i>静音点</span>
      </div>
      <div class="insight" id="insight"></div>
    </div>
    <div class="box">
      <span class="corner tl"></span>
      <h4>已用 / 上限（GB）</h4>
      <div class="chart-wrap dim-wrap"><canvas id="dim1"></canvas></div>
    </div>
    <div class="box">
      <span class="corner tl"></span>
      <h4>物理内存占用（%）</h4>
      <div class="chart-wrap dim-wrap"><canvas id="dim2"></canvas></div>
    </div>
    <div class="box proc">
      <span class="corner tl"></span><span class="corner br"></span>
      <h4>白名单进程 · commit 曲线</h4>
      <div class="chart-wrap proc-wrap"><canvas id="procChart"></canvas></div>
    </div>
  </div>

  <div class="box timeline">
    <span class="corner tl"></span><span class="corner br"></span>
    <h4>事件时间线 · 回溯</h4>
    <div id="events"></div>
  </div>
</main>
<footer>
  <span>采集周期 30 秒 · 数据保留 30 天 · 面板只读（127.0.0.1）· 察于幽冥 · 睁眼为昼 闭眼为夜</span>
  <div class="seal">烛</div>
</footer>
<script src="panel.js"></script>
</body>
</html>
